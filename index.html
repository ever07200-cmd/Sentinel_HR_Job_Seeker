<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sentinel HR">
<meta name="theme-color" content="#1F5F8B">
<title>Sentinel HR — candidate dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --tabrest:#E7EBF1;
  --line:#DCE2EA; --line2:#C6CFDB;
  --ink:#16202E; --mid:#4C5A6C; --soft:#6B7787;
  --accent:#1F5F8B; --accent-soft:#EAF1F7;
  --b1:#1F6B49; --b2:#7A5410; --b3:#9E4718; --b4:#96282C;
  --b1-bg:#EAF3EE; --b2-bg:#FAF3E4; --b3-bg:#FBEEE6; --b4-bg:#F9EBEB; --soft-bg:#F1F4F8; --accent-bg:#EAF1F7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Libre Franklin',system-ui,sans-serif;font-size:15px;line-height:1.6;
  padding-bottom:72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

header.mast{background:var(--card);border-bottom:1px solid var(--line)}
.mastin{max-width:1120px;margin:0 auto;padding:20px 24px 18px}
.brandrow{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline}
.brand{font-size:21px;font-weight:700;letter-spacing:-.015em}
.brand span{color:var(--accent)}
.who{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--soft)}
.figs{display:flex;flex-wrap:wrap;gap:28px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.fig{display:flex;flex-direction:column;gap:1px}
.figl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--soft)}
.figv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-.01em}
.figv.key{color:var(--accent)}

.tabs{display:flex;gap:3px;padding:20px 0 0 6px;flex-wrap:wrap}
.tab{background:var(--tabrest);border:1px solid var(--line);border-bottom:none;color:var(--mid);
  font-family:'Libre Franklin',sans-serif;font-size:13px;font-weight:500;letter-spacing:.01em;
  padding:10px 20px;border-radius:7px 7px 0 0;cursor:pointer;margin-bottom:-1px;position:relative;width:auto}
.tab:hover{background:#EFF2F6;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--card);color:var(--accent);font-weight:600;z-index:2;
  box-shadow:0 -3px 0 var(--accent) inset}
.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;
  box-shadow:0 1px 3px rgba(22,32,46,.05)}
.cbody{padding:26px 28px}
@media(max-width:600px){.cbody{padding:20px 18px}}

label.l{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mid);margin:0 0 6px;font-weight:500}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--ink);
  border-radius:5px;padding:10px 12px;font-family:'Libre Franklin',sans-serif;font-size:14.5px;line-height:1.5}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:#A6B0BE}
.row{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:16px}
@media(min-width:620px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}

.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:5px;
  padding:10px 20px;width:auto;font-family:'Libre Franklin',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;line-height:1.4}
.btn:hover{background:#1A5178;border-color:#1A5178}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--mid);border-color:var(--line2)}
.btn.ghost:hover{background:#F7F9FB;color:var(--ink);border-color:var(--soft)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

.sec{margin-top:30px}
.sech{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:14px;font-weight:500}
.item{display:flex;gap:12px;padding:8px 0;line-height:1.6;align-items:flex-start}
.tick{flex:0 0 auto;width:4px;align-self:stretch;border-radius:2px;min-height:20px}
.note{font-size:14px;color:var(--mid)}
.pitch{background:#F7F9FB;border-left:3px solid var(--accent);padding:16px 20px;border-radius:0 6px 6px 0;
  font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:16.5px;line-height:1.7;color:#22303F}
.bul{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.75;background:#F7F9FB;
  border:1px solid var(--line);border-radius:6px;padding:14px 16px;white-space:pre-wrap}
.letter{background:#F7F9FB;border:1px solid var(--line);border-radius:6px;padding:16px 18px;
  white-space:pre-wrap;font-size:14.5px;line-height:1.7}

.verdictbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.verdict{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:0}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 10px;border-radius:20px;display:inline-block}
.chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 10px;
  border-radius:4px;background:var(--b3-bg);color:var(--b3);margin:0 6px 6px 0}
.caseid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);letter-spacing:.05em;
  margin-bottom:10px}

.src{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);
  border-radius:6px;margin-bottom:8px}
.src:hover{border-color:var(--line2);background:#FCFDFE}
.srcn{font-size:14.5px;font-weight:500}
.srct{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--soft);background:#F1F4F8;border-radius:3px;padding:2px 7px}
.mini{background:var(--card);border:1px solid var(--line2);color:var(--mid);border-radius:5px;width:auto;
  font-family:'Libre Franklin',sans-serif;font-size:12.5px;padding:6px 13px;cursor:pointer;
  text-decoration:none;display:inline-block;font-weight:500}
.mini:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.grouplbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:26px 0 10px;font-weight:600}
.grouplbl:first-of-type{margin-top:14px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soft);text-align:left;padding:12px 14px;border-bottom:2px solid var(--line);font-weight:500}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.qrow:hover{background:#FAFBFD;cursor:pointer}
.score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px}
.empty{padding:56px 24px;text-align:center;color:var(--soft);font-size:14.5px;line-height:1.7}
td select,td input{padding:6px 8px;font-size:13px}
.detail{background:#FAFBFD;padding:0}
.detailin{padding:20px 24px;border-left:3px solid var(--accent)}

.flash{font-size:13px;color:var(--b1);font-weight:500}
.err{border-left:3px solid var(--b4);background:var(--b4-bg);padding:14px 16px;font-size:14px;
  border-radius:0 6px 6px 0;margin-top:16px}
.info{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 18px;font-size:14px;
  border-radius:0 6px 6px 0;margin:18px 0;line-height:1.65}
.scanning{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}
.scanning::after{content:"";display:block;height:100%;width:35%;background:var(--accent);
  border-radius:2px;animation:sweep 1.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion: reduce){.scanning::after{animation:none;width:100%;opacity:.4}}
.foot{font-size:13px;color:var(--soft);line-height:1.65;margin-top:16px}
h3.sub{font-size:16px;font-weight:600;margin:0 0 4px}
.cov{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0 4px}
@media(min-width:640px){.cov{grid-template-columns:1fr 1fr}}
.covi{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);
  border-radius:5px;font-size:13.5px;line-height:1.5}
.covi.hit{background:var(--b1-bg);border-color:#BFDCCE}
.covi.miss{background:var(--b4-bg);border-color:#EBC9C9}
.covm{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;flex:0 0 auto}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.meter span{display:block;height:100%;border-radius:4px}
.audit{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.audit:last-child{border-bottom:0}
.abadge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;
  padding:3px 8px;border-radius:3px;flex:0 0 auto;min-width:64px;text-align:center;margin-top:2px}
.big{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fchip{background:var(--card);border:1px solid var(--line2);color:var(--mid);border-radius:20px;width:auto;
  font-family:'Libre Franklin',sans-serif;font-size:12.5px;padding:6px 14px;cursor:pointer;font-weight:500}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.audrow{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:var(--card)}
.audrow.on{border-color:var(--accent);background:var(--accent-soft)}
.audname{font-size:14.5px;font-weight:600;margin-bottom:5px}
.audtext{font-size:13.5px;line-height:1.6;color:var(--mid)}
.qcard{border:1px solid var(--line);border-radius:8px;padding:20px 22px;background:#FCFDFE}
.qmeta{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);margin-left:auto}
.qtext{font-size:17px;font-weight:600;line-height:1.45;margin:0}
.hook{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);margin:8px 0 0;
  letter-spacing:.02em}
.qlist{padding:14px 0;border-bottom:1px solid var(--line)}
.qlist:last-child{border-bottom:0}
.sumlink{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500}
.soft-bg{background:#F1F4F8}
.steps{counter-reset:s;margin:18px 0}
/* ============ phone ============ */
@media (max-width: 760px){
  body{ font-size:16px; padding-bottom:40px;
        padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  .wrap{ padding:0 12px }
  .mastin{ padding:14px 14px 12px }
  .brand{ font-size:19px }
  .who{ font-size:11px }

  /* income strip scrolls sideways instead of wrapping into a wall */
  .figs{ gap:20px; margin-top:12px; padding-top:12px; overflow-x:auto;
         flex-wrap:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none }
  .figs::-webkit-scrollbar{ display:none }
  .fig{ flex:0 0 auto }
  .figv{ font-size:16px }

  /* tabs become a swipeable strip, always reachable */
  .tabs{ padding:12px 0 0 2px; flex-wrap:nowrap; overflow-x:auto;
         -webkit-overflow-scrolling:touch; scrollbar-width:none }
  .tabs::-webkit-scrollbar{ display:none }
  .tab{ flex:0 0 auto; font-size:14px; padding:11px 16px }

  .card{ border-radius:8px }
  .cbody{ padding:18px 14px }

  /* 16px minimum stops iOS zooming the page on focus */
  input, textarea, select{ font-size:16px; padding:12px; border-radius:8px }
  textarea{ min-height:120px }
  label.l{ font-size:11px }
  .row{ gap:14px; margin-bottom:18px }
  .row.c2, .row.c3{ grid-template-columns:1fr }

  /* thumb-sized controls */
  .btn{ font-size:15px; padding:13px 20px; border-radius:8px; min-height:48px; flex:1 1 auto }
  .btn.ghost{ flex:1 1 auto }
  .mini{ font-size:13px; padding:10px 14px; min-height:40px }
  .actions{ gap:8px }
  .fchip{ font-size:13px; padding:9px 15px; min-height:40px }
  .chips{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch;
          scrollbar-width:none; padding-bottom:4px }
  .chips::-webkit-scrollbar{ display:none }

  /* practice card is the main reason to be on a phone — make it comfortable */
  .qcard{ padding:18px 16px }
  .qtext{ font-size:18px; line-height:1.4 }
  .hook{ font-size:13px }
  .pitch{ font-size:16px; padding:16px; line-height:1.65 }
  .letter, .bul{ font-size:14px }
  .bul{ overflow-x:auto }

  .sec{ margin-top:26px }
  .item{ font-size:15px }
  .verdict{ font-size:23px }
  .big{ font-size:30px }
  .cov{ grid-template-columns:1fr }
  .src{ padding:13px 14px }
  .srcn{ font-size:15px }

  /* tables scroll rather than crush */
  table{ font-size:14px; min-width:620px }
  th, td{ padding:11px 10px }
  .foot{ font-size:13px }
  .info, .err{ font-size:14px; padding:14px }
}

@media (max-width: 400px){
  .tab{ padding:11px 13px; font-size:13.5px }
  .cbody{ padding:16px 12px }
  .verdict{ font-size:21px }
}

/* installed to the home screen: no browser chrome, so add breathing room up top */
@media (display-mode: standalone){
  header.mast{ padding-top:env(safe-area-inset-top) }
}
.stepi{display:flex;gap:14px;padding:10px 0;align-items:flex-start}
.stepn{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:flex;
  align-items:center;justify-content:center;margin-top:2px}
</style>
</head>
<body>

<header class="mast">
  <div class="mastin">
    <div class="brandrow">
      <div class="brand">Sentinel <span>HR</span></div>
      <div class="who" id="opline"></div>
    </div>
    <div class="figs" id="floor"></div>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="card"><div class="cbody" id="view"></div></div>
</div>

<script>
const KEY = "sentinelhr.v1";

const DEFAULTS = {
  activeProfile: "A",
  profiles: {
    A: {
      name: "John Everson Ramos",
      title: "Advanced Service Lead — Vulnerability Management",
      years: "15",
      skills: "Vulnerability management, patch management, patch governance, remediation SLAs, GRC, security coordination, Tanium, ISO 27001, NIST CSF/800-53, stakeholder reporting, risk ticketing, EOL/EOS inventory, Azure + AWS + on-prem patch compliance",
      wins: "",
      booleans: '("vulnerability management" OR "patch management" OR "patch governance" OR "vulnerability remediation") AND (Tanium OR Qualys OR Rapid7 OR Nessus OR "Defender for Endpoint")',
      notes: "Philippines-based. Wants fully remote, any time zone; hybrid acceptable. Targets US/EU/AU employers, MSPs and staffing intermediaries serving US clients, and Global Capability Centres with PH presence.",
      floorNet: 76000, applyThreshold: 65,
      setup: "Fully remote strongly preferred. Metro Manila hybrid acceptable only for a strong-fit role.",
      resume: ""
    },
    B: { name: "Operator B", title: "", years: "", skills: "", wins: "", booleans: "",
         notes: "Philippines-based. Fill this in for a second job seeker.",
         floorNet: 45000, applyThreshold: 60,
         setup: "Fully remote strongly preferred. Metro Manila hybrid acceptable only for a strong-fit role.",
         resume: "" }
  },
  taxUplift: 1.26, fx: 57,
  mode: "paste", apiKey: "", model: "claude-sonnet-5", queue: []
};

let S = load(), tab = "profile", result = null, busy = false, error = "", flash = "", openRow = null;
let draft = { co:"", ro:"", jd:"", reply:"" };
function setDraft(f,v){ draft[f] = v; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const got = JSON.parse(raw);
    const merged = {...structuredClone(DEFAULTS), ...got,
      profiles:{...DEFAULTS.profiles, ...(got.profiles||{})}};
    for(const k of ["A","B"]) merged.profiles[k] = {...DEFAULTS.profiles[k], ...(merged.profiles[k]||{})};
    if(got.floorNet != null){
      for(const k of ["A","B"]) if(got.profiles?.[k]?.floorNet == null) merged.profiles[k].floorNet = got.floorNet;
      delete merged.floorNet;
    }
    (merged.queue||[]).forEach(it=>{
      if(it && it.interview && !it.interviews){
        it.interviews = {}; it.interviews[it.interview._audience || "auto"] = it.interview;
        delete it.interview;
      }
    });
    if(got.applyThreshold != null){
      for(const k of ["A","B"]) if(got.profiles?.[k]?.applyThreshold == null) merged.profiles[k].applyThreshold = got.applyThreshold;
      delete merged.applyThreshold;
    }
    return merged;
  }catch{ return structuredClone(DEFAULTS); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.error(e); } }

const BANDS = [
  {min:80,key:"b1",label:"Strong match",note:"Apply today. Tailor and send."},
  {min:65,key:"b2",label:"Worth applying",note:"Apply, but close the gaps in your cover note."},
  {min:45,key:"b3",label:"Stretch",note:"Only if the pipeline is thin this week."},
  {min:0, key:"b4",label:"Skip",note:"Not worth the hour. Move on."}
];
const bandOf = s => BANDS.find(b => s >= b.min) || BANDS[3];
const peso = n => "\u20B1" + Math.round(Number(n)||0).toLocaleString("en-PH");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const profile = () => S.profiles[S.activeProfile] || S.profiles.A;
const floorNet = () => Number(profile().floorNet) || 0;
const applyLine = () => Number(profile().applyThreshold) || 65;
const grossFloor = () => Math.round(floorNet() * S.taxUplift);
const usdFloor = () => Math.round(grossFloor() / (S.fx || 57));

function copy(text, tag){
  navigator.clipboard?.writeText(text);
  flash = tag || "Copied"; render();
  setTimeout(()=>{ flash=""; render(); }, 2000);
}

const SOURCES = [
  ["Philippines boards","JobStreet PH","prefilled",q=>`https://ph.jobstreet.com/jobs?keywords=${q}`],
  ["Philippines boards","Indeed PH","prefilled",q=>`https://ph.indeed.com/jobs?q=${q}&l=Remote`],
  ["Philippines boards","LinkedIn — remote, PH","prefilled",q=>`https://www.linkedin.com/jobs/search/?keywords=${q}&location=Philippines&f_WT=2`],
  ["Philippines boards","Kalibrr","paste",()=>`https://www.kalibrr.com/job-board`],
  ["Philippines boards","foundit PH","prefilled",q=>`https://www.foundit.com.ph/srp/results?query=${q}`],
  ["Philippines boards","Bossjob","paste",()=>`https://bossjob.ph/jobs`],
  ["Philippines boards","OnlineJobs.ph","prefilled",q=>`https://www.onlinejobs.ph/jobseekers/jobsearch?jobkeyword=${q}`],
  ["Global remote","Google Jobs","prefilled",q=>`https://www.google.com/search?q=${q}+remote+philippines&ibp=htl;jobs`],
  ["Global remote","We Work Remotely","prefilled",q=>`https://weworkremotely.com/remote-jobs/search?term=${q}`],
  ["Global remote","Remotive","prefilled",q=>`https://remotive.com/remote-jobs/search?search=${q}`],
  ["Global remote","Himalayas","prefilled",q=>`https://himalayas.app/jobs?search=${q}`],
  ["Global remote","RemoteOK","prefilled",q=>`https://remoteok.com/?tags=${q}`],
  ["Global remote","Wellfound","paste",()=>`https://wellfound.com/jobs`],
  ["Global remote","Jobgether","paste",()=>`https://jobgether.com/`],
  ["Global remote","Working Nomads","prefilled",q=>`https://www.workingnomads.com/jobs?search=${q}`],
  ["Overlooked","HN Who is hiring","paste",()=>`https://news.ycombinator.com/submitted?id=whoishiring`],
  ["Overlooked","Asian Development Bank","paste",()=>`https://www.adb.org/work-with-us/careers`],
  ["Overlooked","Y Combinator startups","paste",()=>`https://www.workatastartup.com/jobs`],
  ["PH to US placement","Support Shepherd","paste",()=>`https://supportshepherd.com/`],
  ["PH to US placement","Somewhere","paste",()=>`https://www.somewhere.com/`],
  ["PH to US placement","Penbrothers","paste",()=>`https://www.penbrothers.com/`],

function gauge(score, threshold){
  const W=680, H=64, x=v=>(v/100)*W, tx=x(threshold);
  const segs=[[0,45,"var(--b4)"],[45,65,"var(--b3)"],[65,80,"var(--b2)"],[80,100,"var(--b1)"]];
  const labels=[[22,"Skip"],[55,"Stretch"],[72,"Apply"],[90,"Strong"]];
  return `<svg viewBox="0 -10 ${W} ${H}" width="100%" style="margin:18px 0 8px;display:block" role="img"
    aria-label="Fit score ${score} of 100, apply threshold ${threshold}">
    ${segs.map(([a,b,c])=>`<rect x="${x(a)}" y="20" width="${x(b)-x(a)-2}" height="10" rx="2"
      fill="${c}" opacity="${score>=a?0.85:0.18}"/>`).join("")}
    ${labels.map(([p,t])=>`<text x="${x(p)}" y="45" fill="var(--soft)" font-size="10.5"
      font-family="IBM Plex Mono, monospace" text-anchor="middle" letter-spacing="0.06em">${t}</text>`).join("")}
    <line x1="${tx}" y1="14" x2="${tx}" y2="36" stroke="var(--ink)" stroke-width="1.5"/>
    <g transform="translate(${x(score)},0)">
      <polygon points="0,17 -5,7 5,7" fill="var(--ink)"/>
      <text x="0" y="5" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle"
        font-family="IBM Plex Mono, monospace">${score}</text>
    </g></svg>`;
}

/* ==========================================================
   resume engine — runs locally, costs nothing
   ========================================================== */
const FILLER = ["responsible for","duties included","team player","hard worker","results-driven",
  "detail-oriented","go-getter","think outside the box","proven track record","dynamic professional",
  "self-starter","excellent communication skills","works well under pressure"];
const WEAK = ["helped","assisted with","worked on","participated in","involved in","tasked with"];
const SECTIONS = [
  ["summary", /(professional\s+)?(summary|profile|objective)/i],
  ["experience", /(work\s+)?(experience|employment|history)/i],
  ["skills", /(technical\s+)?(skills|competencies|tools|technologies)/i],
  ["education", /education|academic/i],
  ["certs", /certification|licen[cs]e|credential/i]
];

function resumeStats(txt){
  const lines = txt.split(/\n/).map(l=>l.trim());
  const words = txt.split(/\s+/).filter(Boolean);
  const bullets = lines.filter(l=>/^[-•*\u2013\u2022]/.test(l) && l.length>12);
  const quantified = bullets.filter(b=>/\d/.test(b));
  const longBullets = bullets.filter(b=>b.split(/\s+/).length>35);
  const weakStart = bullets.filter(b=>WEAK.some(w=>b.toLowerCase().replace(/^[-•*\u2013\u2022]\s*/,"").startsWith(w)));
  const found = {};
  for(const [k,re] of SECTIONS) found[k] = lines.some(l=>l.length<60 && re.test(l));
  const fillers = FILLER.filter(f=>txt.toLowerCase().includes(f));
  const pronouns = (txt.match(/\b(I|my|me)\b/g)||[]).length;
  const email = /[\w.+-]+@[\w-]+\.[\w.]+/.test(txt);
  const dates = (txt.match(/\b(19|20)\d{2}\b/g)||[]).length;
  return {words:words.length, bullets:bullets.length, quantified:quantified.length,
    longBullets:longBullets.length, weakStart:weakStart.length, found, fillers, pronouns, email, dates};
}

function auditResume(txt){
  if(!txt || txt.trim().length < 200) return null;
  const st = resumeStats(txt);
  const out = [];
  const add = (level,title,detail) => out.push({level,title,detail});
  const qPct = st.bullets ? Math.round(st.quantified/st.bullets*100) : 0;

  if(st.words < 350) add("fix","Too short",`About ${st.words} words. A fifteen-year career needs 500 to 900 to carry enough keywords and evidence.`);
  else if(st.words > 1100) add("fix","Too long",`About ${st.words} words. Cut older roles to two lines each and get under 900.`);
  else add("ok","Length is right",`${st.words} words sits in the range recruiters and parsers both handle well.`);

  for(const [k,label] of [["summary","Summary"],["experience","Experience"],["skills","Skills"],["education","Education"]]){
    if(!st.found[k]) add("fix",`No ${label} heading found`,`Parsers look for a plain heading on its own line. Add one that literally reads ${label}.`);
  }
  if(!st.found.certs) add("warn","No certifications heading","If you hold any, give them their own heading. If you hold none, ignore this.");

  if(st.bullets < 8) add("fix","Too few bullet points",`Found ${st.bullets}. Aim for three to six per recent role, written as achievements.`);
  else add("ok","Bullet count is healthy",`${st.bullets} bullets found.`);

  if(qPct < 40) add("fix","Not enough numbers",`Only ${qPct}% of your bullets contain a figure. Target half or more — counts, percentages, timeframes, estate sizes.`);
  else if(qPct < 60) add("warn","Numbers could go further",`${qPct}% of bullets are quantified. Push toward 60%.`);
  else add("ok","Well quantified",`${qPct}% of bullets carry a figure.`);

  if(st.longBullets) add("warn","Some bullets run long",`${st.longBullets} bullet${st.longBullets>1?"s":""} over 35 words. Split or trim them.`);
  if(st.weakStart) add("warn","Weak opening verbs",`${st.weakStart} bullet${st.weakStart>1?"s":""} start with words like "helped" or "worked on". Start with what you did: reduced, led, built, cut, coordinated.`);
  if(st.fillers.length) add("fix","Filler phrases present",`Remove: ${st.fillers.join(", ")}. These take space and say nothing.`);
  if(st.pronouns > 2) add("warn","First-person pronouns",`Found ${st.pronouns}. Resume bullets drop "I" and "my" by convention.`);
  if(!st.email) add("fix","No email address found","Include a professional email. Leave out your full home address — city and country is enough.");
  if(st.dates < 4) add("warn","Few dates found","Every role needs a start and end date. Gaps in dates get flagged by screening software.");

  const fixes = out.filter(o=>o.level==="fix").length, warns = out.filter(o=>o.level==="warn").length;
  const score = Math.max(0, Math.min(100, 100 - fixes*11 - warns*4));
  return {items:out, score, st, qPct};
}

/* keyword coverage against a specific posting */
function coverage(resume, terms){
  const hay = " " + resume.toLowerCase().replace(/[^a-z0-9&+#.\s-]/g," ").replace(/\s+/g," ") + " ";
  return terms.map(t=>{
    const term = String(t).trim();
    const low = term.toLowerCase();
    let hit = hay.includes(" "+low+" ") || hay.includes(low);
    if(!hit){
      const parts = low.split(/[\s\-\/]+/).filter(w=>w.length>3);
      hit = parts.length>1 && parts.every(w=>hay.includes(w));
    }
    return {term, hit};
  });
}

function jobTerms(item){
  const a = item?.assessment || {};
  const extra = (document.getElementById("extraKw")?.value || "")
    .split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  return [...new Set([...(a.ats_keywords||[]), ...extra])];
}

KEYWORDS FROM THIS POSTING THAT ARE MISSING FROM THE RESUME

Return ONLY a JSON object. No markdown, no backticks, no preamble.

/* ---------- API mode ---------- */
async function runScan(){
  const jd = (draft.jd||"").trim();
  const company = (draft.co||"").trim();
  const role = (draft.ro||"").trim();
  if(jd.length < 80){ error="Paste the full job description — at least a few sentences of it."; render(); return; }
  if(!S.apiKey){ error="No API key saved. Switch to paste mode on the Settings tab, or add a key there."; render(); return; }

  busy=true; error=""; result=null; render();
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":S.apiKey,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:S.model, max_tokens:2600,
        messages:[{role:"user",content:buildPrompt(company,role,jd)}]})
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error.message || "the API rejected the request");
    let txt = (data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    result = parseResult(txt, company, role);
  }catch(e){
    console.error(e);
    error = "The scan didn't complete: " + e.message;
  }finally{ busy=false; render(); }
}

function parseResult(txt, company, role){
  txt = txt.replace(/```json/g,"").replace(/```/g,"").trim();
  const o = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}")+1));
  o._company = company; o._role = role;
  return o;
}

/* ---------- paste mode ---------- */
function copyPrompt(){
  const jd = (draft.jd||"").trim();

  if(!company){ error="Enter the company name first — it labels the row in your queue."; render(); return; }
  error=""; copy(buildPrompt(company,role,jd), "Prompt copied — paste it into a chat with Claude");
}

function renderPasted(){
  const txt = (draft.reply||"").trim();
  const company = (draft.co||"").trim();
  const role = (draft.ro||"").trim();
  if(!txt){ error="Paste Claude's reply into the box first."; render(); return; }
  try{
    result = parseResult(txt, company, role); error="";
  }catch(e){
    error = "That didn't parse. Copy Claude's whole reply, including the opening and closing braces.";
  }
  render();
}

/* ==========================================================
   document builder — assembles an ATS-safe resume and exports it
   ========================================================== */

/* split a pasted master resume into its sections */
function splitSections(txt){
  const lines = (txt||"").split(/\n/);
  const out = { header:[], summary:[], skills:[], experience:[], certs:[], education:[] };
  let cur = "header";
  for(const raw of lines){
    const l = raw.trim();
    if(l && l.length < 60){
      const hit = SECTIONS.find(([k,re]) => re.test(l) && l.split(/\s+/).length <= 4);
      if(hit){ cur = hit[0]; continue; }
    }
    out[cur].push(raw);
  }
  const clean = a => a.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  return { header:clean(out.header), summary:clean(out.summary), skills:clean(out.skills),
           experience:clean(out.experience), certs:clean(out.certs), education:clean(out.education) };
}

/* turn free-text experience into the builder's markup */
const MONTHS = "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*";
const DATERANGE = new RegExp("((?:" + MONTHS + "\\s+)?(?:19|20)\\d{2}\\s*[\\u2013-]\\s*(?:(?:" + MONTHS + "\\s+)?(?:19|20)\\d{2}|Present|Current))\\s*$", "i");

function markExperience(txt){
  const out = [];
  let pendingDate = null;
  const flush = () => { if(pendingDate){ out.push(pendingDate); pendingDate = null; } };

  (txt||"").split(/\n/).forEach(raw=>{
    const l = raw.trim();
    if(!l){ flush(); out.push(""); return; }

    if(/^[-•*\u2013\u2022]/.test(l)){
      flush();
      out.push("- " + l.replace(/^[-•*\u2013\u2022]\s*/,""));
      return;
    }

    const m = l.match(DATERANGE);
    if(m){
      flush();
      const title = l.slice(0, m.index).replace(/[\s,|\u2013-]+$/,"").trim();
      if(title){ out.push("# " + title); pendingDate = m[1].trim(); }
      else out.push(m[1].trim());
      return;
    }

    // the line straight after a dated title is the employer: plain, then the dates
    if(pendingDate){ out.push(l); flush(); return; }

    if(/^[A-Z][^.]{4,70}$/.test(l)){ out.push("# " + l); return; }
    out.push(l);
  });
  flush();
  return out.join("\n");
}

function assembleResume(p, prep){
  const sec = splitSections(p.resume||"");
  const contact = (sec.header||"").split(/\n/).map(x=>x.trim()).filter(Boolean);
  const name = contact.shift() || p.name || "";
  const lines = [];
  lines.push(name);
  contact.slice(0,4).forEach(c=>{
    c.split(/\s*[|·]\s*/).filter(Boolean).forEach(part=>lines.push("@ " + part.trim()));
  });
  lines.push("");
  lines.push("## PROFESSIONAL SUMMARY");
  lines.push(prep?.summary || sec.summary || "");
  lines.push("");
  lines.push("## SKILLS");
  lines.push(prep?.skills_line || sec.skills || "");
  lines.push("");
  if(prep?.bullets?.length){
    lines.push("## CAREER HIGHLIGHTS");
    prep.bullets.forEach(b=>lines.push("- " + b));
    lines.push("");
  }
  lines.push("## PROFESSIONAL EXPERIENCE");
  lines.push(markExperience(sec.experience));
  lines.push("");
  if(sec.certs){
    lines.push("## CERTIFICATIONS");
    sec.certs.split(/\n/).map(x=>x.replace(/^[-•*\u2013\u2022]\s*/,"").trim()).filter(Boolean)
      .forEach(c=>lines.push("- " + c));
    lines.push("");
  }
  lines.push("## EDUCATION");
  lines.push(sec.education || "[Add your degree, institution and year]");
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* plain text — the safest thing to paste into an online application form */
function resumePlain(src){
  return (src||"").split(/\n/).map(l=>{
    const t = l.trim();
    if(t.startsWith("## ")) return "\n" + t.slice(3).toUpperCase();
    if(t.startsWith("# ")) return t.slice(2);
    if(t.startsWith("@ ")) return t.slice(2);
    if(t.startsWith("- ")) return "- " + t.slice(2);
    return t;
  }).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* Word-compatible HTML. No tables, no columns, no header or footer. */
function resumeWordHtml(src, name){
  const esc2 = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const body = [];
  let inList = false;
  const closeList = () => { if(inList){ body.push("</ul>"); inList = false; } };
  const lines = (src||"").split(/\n/);
  lines.forEach((raw,i)=>{
    const t = raw.trim();
    if(!t){ closeList(); return; }
    if(i===0){ body.push(`<p class=Name>${esc2(t)}</p>`); return; }
    if(t.startsWith("@ ")){ closeList(); body.push(`<p class=Contact>${esc2(t.slice(2))}</p>`); return; }
    if(t.startsWith("## ")){ closeList(); body.push(`<h1>${esc2(t.slice(3).toUpperCase())}</h1>`); return; }
    if(t.startsWith("# ")){ closeList(); body.push(`<h2>${esc2(t.slice(2))}</h2>`); return; }
    if(t.startsWith("- ")){ if(!inList){ body.push("<ul>"); inList = true; } body.push(`<li>${esc2(t.slice(2))}</li>`); return; }
    closeList(); body.push(`<p>${esc2(t)}</p>`);
  });
  closeList();
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office'
xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${esc2(name)}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
<style>
@page{margin:1.9cm 2.0cm}
body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;line-height:1.25;color:#000}
p.Name{font-size:17pt;font-weight:bold;margin:0 0 2pt 0}
p.Contact{font-size:10pt;margin:0;color:#222}
h1{font-size:11pt;font-weight:bold;text-transform:uppercase;letter-spacing:.4pt;
   margin:14pt 0 4pt 0;border-bottom:1pt solid #000;padding-bottom:2pt}
h2{font-size:10.5pt;font-weight:bold;margin:9pt 0 2pt 0}
p{margin:0 0 4pt 0}
ul{margin:2pt 0 6pt 0;padding-left:16pt}
li{margin:0 0 3pt 0}
</style></head><body>${body.join("\n")}</body></html>`;
}

function downloadBlob(content, filename, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function safeName(p, item, ext){
  const who = (p.name||"Resume").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
  const co = item ? "_" + (item.company||"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"") : "";
  return `${who}${co}_Resume.${ext}`;
}

/* true .docx via the docx library, loaded on demand. Falls back to .doc. */
let docxLib = null;
function loadDocx(){
  if(docxLib) return Promise.resolve(docxLib);
  if(window.docx){ docxLib = window.docx; return Promise.resolve(docxLib); }
  const urls = ["https://unpkg.com/docx@8.5.0/build/index.umd.js",
                "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"];
  return urls.reduce((chain,url)=>chain.catch(()=>new Promise((res,rej)=>{
    const sc = document.createElement("script");
    sc.src = url; sc.onload = ()=>{ if(window.docx){ docxLib = window.docx; res(docxLib); } else rej(); };
    sc.onerror = rej; document.head.appendChild(sc);
  })), Promise.reject());
}

async function docxBlobFromMarkup(src){
  const d = await loadDocx();
  {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, BorderStyle, LevelFormat } = d;
    const kids = [];
    let first = true;
    for(const raw of src.split(/\n/)){
      const t = raw.trim();
      if(!t) continue;
      if(first){ first = false;
        kids.push(new Paragraph({ spacing:{after:40},
          children:[new TextRun({text:t, bold:true, size:34, font:"Calibri"})] })); continue; }
      if(t.startsWith("@ ")){
        kids.push(new Paragraph({ spacing:{after:20},
          children:[new TextRun({text:t.slice(2), size:20, font:"Calibri"})] })); continue; }
      if(t.startsWith("## ")){
        kids.push(new Paragraph({ heading:HeadingLevel.HEADING_1, spacing:{before:260, after:90},
          border:{bottom:{style:BorderStyle.SINGLE, size:6, color:"000000", space:2}},
          children:[new TextRun({text:t.slice(3).toUpperCase(), bold:true, size:22, font:"Calibri", color:"000000"})] })); continue; }
      if(t.startsWith("# ")){
        kids.push(new Paragraph({ heading:HeadingLevel.HEADING_2, spacing:{before:170, after:40},
          children:[new TextRun({text:t.slice(2), bold:true, size:21, font:"Calibri", color:"000000"})] })); continue; }
      if(t.startsWith("- ")){
        kids.push(new Paragraph({ numbering:{reference:"rbul", level:0}, spacing:{after:60},
          children:[new TextRun({text:t.slice(2), size:21, font:"Calibri"})] })); continue; }
      kids.push(new Paragraph({ spacing:{after:80},
        children:[new TextRun({text:t, size:21, font:"Calibri"})] }));
    }
    const doc = new Document({
      numbering:{ config:[{ reference:"rbul", levels:[{ level:0, format:LevelFormat.BULLET, text:"\u2022",
        alignment:AlignmentType.START, style:{paragraph:{indent:{left:340, hanging:200}}} }] }] },
      styles:{ default:{ document:{ run:{ font:"Calibri", size:21 } } } },
      sections:[{ properties:{ page:{ margin:{top:1080,bottom:1080,left:1130,right:1130} } }, children:kids }]
    });
    return await Packer.toBlob(doc);
  }
}

  }

    L.push("## YOUR OPENING");

    L.push(iv.opening);

      L.push("Type: " + (TYPE_LABEL[q.type]||q.type) + (q.hook ? "   ·   Anchor: " + q.hook : ""));
      L.push(q.answer||"");
      if(q.why) L.push("They are testing: " + q.why);
      L.push("");

  if(iv.salary_script){ L.push("## WHEN THEY ASK ABOUT SALARY"); L.push(iv.salary_script); L.push(""); }

      const blob = await docxBlobFromMarkup(src);
      downloadBlob(blob, ivFileName(item,"docx"), "");
      flash = "Downloaded as .docx";
    } else if(fmt==="csv"){
      downloadBlob(interviewCsv(item), ivFileName(item,"csv"), "text/csv;charset=utf-8");
      flash = "Downloaded — open it in Excel";
    } else if(fmt==="txt"){
      downloadBlob(resumePlain(src), ivFileName(item,"txt"), "text/plain;charset=utf-8");
      flash = "Downloaded as .txt";
    } else {
      downloadBlob(resumeWordHtml(src, profile().name), ivFileName(item,"doc"), "application/msword");
      flash = "Downloaded as .doc — open in Word";
    }
    error="";
  }catch(e){
    console.error(e);
    downloadBlob(resumeWordHtml(src, profile().name), ivFileName(item,"doc"), "application/msword");
    flash = "Downloaded as .doc — open in Word and Save As .docx";
  }
  render();
  setTimeout(()=>{flash=""; render();}, 3000);
}

function showPrep(){
  const el = document.getElementById("rreply");
  if(!el || !el.value.trim()){ error="Paste Claude's reply into the box first."; render(); return; }
  try{
    const t = el.value.replace(/```json/g,"").replace(/```/g,"").trim();
    rPrep = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1));
    error="";
  }catch{ error="That didn't parse. Copy the whole reply, including the opening and closing braces."; }
  render();
}

    <div class="info" style="margin-top:26px"><strong>Read the location line before you apply.</strong> On most
    global boards, "remote" means remote within the United States or the EU. Filter for
    <em>Worldwide</em>, <em>Anywhere</em> or <em>APAC</em>, and skip anything asking for US work authorization —
    that route means relocating on a visa, not working from here.</div>
    <p class="foot">Boards change their URL formats without notice. If a link lands on a homepage rather than
    results, paste the boolean string into that site's own search box. Boards marked "paste" never accept a
    URL query, so those always need the clipboard.</p>`;
}

/* ---------- follow-up message writer ---------- */
const FOLLOWUPS = {
  applied:  ["Note after applying", "You applied and want to land on their radar without being a nuisance."],
  silence:  ["Nudge after a week of silence", "No reply since you applied. Add something rather than repeat yourself."],
  thanks:   ["Thank you after an interview", "Send within 24 hours. Reference something specific they said."],
  delay:    ["Check in after a delay", "They promised a decision and the date has passed."],
  offer:    ["Ask about timeline while deciding", "You have interest elsewhere, or need a decision date."],
  closed:   ["Graceful close after a rejection", "Rejected. Leave the door open — people move and reqs reopen."]
};
let fuStage = "silence", fuOut = "", fuTarget = "";

function buildFollowupPrompt(item){
  const p = profile();
  const iv = item.interviews ? Object.values(item.interviews)[0] : null;
  return `Write follow-up messages for a specific job application. These are short professional messages, not letters.

CANDIDATE
${p.name}, ${p.title}, ${p.years} years.
Background: ${p.skills}
${p.wins ? "Results they can reference: " + p.wins.slice(0,700) : ""}

THE APPLICATION
Company: ${item.company}
Role: ${item.role}
Status: ${item.status}
Applied or last contact: ${item.added}${item.next ? " · follow-up was due " + item.next : ""}
${item.jd ? "Posting extract: " + item.jd.slice(0,1200) : ""}
${iv && iv.what_they_want ? "What this employer appears to care about: " + (iv.what_they_want||[]).slice(0,2).join(" | ") : ""}

SITUATION
${FOLLOWUPS[fuStage][0]} — ${FOLLOWUPS[fuStage][1]}

RULES
Under 120 words. No "just checking in", no "circling back", no "I wanted to reach out".
Every message must ADD something — a relevant thought, a specific detail, a piece of evidence —
rather than repeating that they applied. Warm and plain, the way a competent adult writes.
Never sound anxious or apologetic. Do not beg.

Return ONLY a JSON object. No markdown, no backticks, no preamble.
{
 "subject": "<email subject line, under 8 words. Empty string if this is a LinkedIn message.>",
 "message": "<the message itself>",
 "why": "<one sentence on what this message is doing tactically>",
 "send_to": "<who should receive it, and how to find them if they have not given a name>",
 "timing": "<when to send it, and what to do if there is still no reply>",
 "variant": "<a shorter, blunter alternative in one or two sentences, for LinkedIn or SMS>"
}`;
}

function showFollowup(){
  const el = document.getElementById("fureply");
  if(!el || !el.value.trim()){ error="Paste the reply into the box first."; render(); return; }
  try{
    const t = el.value.replace(/```json/g,"").replace(/```/g,"").trim();
    fuOut = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1)); error="";
  }catch{ error="That didn't parse. Copy the whole reply including the braces."; }
  render();
}

function viewQueue(){
  const sorted = [...S.queue].sort((a,b)=>b.score-a.score);
  const live = S.queue.filter(i=>i.status!=="Rejected"&&i.status!=="Withdrawn").length;
  const opts = ["To apply","Applied","Screening","Interviewing","Offer","Rejected","Withdrawn"];
  const today = new Date().toISOString().slice(0,10);
  return `
    <h3 class="sub">Application queue</h3>
    <p class="note" style="margin-top:0;margin-bottom:8px">${live} live, ${S.queue.length} total. Sorted by fit,
    so your best application is always at the top.</p>
    <div class="info">This is a decision list, not an auto-applier. Every row keeps its full assessment —
    click a row to reopen the pitch, cover note, keywords and interview prep when you sit down to apply.</div>
    ${S.queue.length===0?`<div class="empty">Nothing queued yet.<br>Assess a posting on the Scan tab and add it here.</div>`:`
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Fit</th><th>Company</th><th>Role</th><th>Pay</th><th>Status</th><th>Follow up</th><th></th></tr></thead>
      <tbody>${sorted.map(i=>{
        const b=bandOf(i.score);
        const ck=i.clears==="yes"?"b1":i.clears==="no"?"b4":"b2";
        const overdue = i.next && i.next < today && i.status!=="Rejected" && i.status!=="Withdrawn";
        return `<tr class="qrow" onclick="toggleRow(event,${i.id})">
        <td class="score" style="color:var(--${b.key})">${i.score}</td>
        <td><input value="${esc(i.company)}" onclick="event.stopPropagation()"
          onchange="setField2(${i.id},'company',this.value)"
          style="font-weight:500;padding:6px 8px;font-size:13px;min-width:130px"
          placeholder="Company name"></td>
        <td><input value="${esc(i.role)}" onclick="event.stopPropagation()"
          onchange="setField2(${i.id},'role',this.value)"
          style="padding:6px 8px;font-size:13px;color:var(--mid);min-width:150px"
          placeholder="Role title"></td>
        <td><span class="pill" style="font-size:10px;color:var(--${ck});background:var(--${ck}-bg)">${esc(i.clears||"unknown")}</span></td>
        <td><select onclick="event.stopPropagation()" onchange="setStatus(${i.id},this.value)">
          ${opts.map(o=>`<option ${o===i.status?"selected":""}>${o}</option>`).join("")}</select></td>
        <td><input type="date" value="${esc(i.next||"")}" onclick="event.stopPropagation()"
          onchange="setNext(${i.id},this.value)"
          style="${overdue?"border-color:var(--b4);color:var(--b4);font-weight:600":""}"></td>
        <td><button class="mini" onclick="event.stopPropagation();removeRow(${i.id})">Remove</button></td></tr>
        ${openRow===i.id && i.assessment?`<tr><td colspan="7" class="detail"><div class="detailin">
          ${renderAssessment(i.assessment,{compact:true})}</div></td></tr>`:""}
        ${openRow===i.id && !i.assessment?`<tr><td colspan="7" class="detail"><div class="detailin">
          <p class="note">This one was added before assessments were stored. Re-assess it on the Scan tab to
          attach the full report.</p></div></td></tr>`:""}`;
      }).join("")}</tbody>
    </table></div>
    <p class="foot">Set a follow-up date when you apply. A date in the past turns red — that's your cue to
    chase it. Roughly a week after applying, and again a week after any interview.</p>

    <div class="sec"><div class="sech">Write a follow-up message</div>
      <p class="note" style="margin-top:0;margin-bottom:14px">Most applications die from silence rather than
      rejection. A message that adds something is one of the cheapest things that changes an outcome.</p>
      <div class="row c2">
        <div><label class="l">Which application</label>
          <select onchange="fuTarget=this.value;fuOut='';render()">
            <option value="">Choose one…</option>
            ${S.queue.map(q=>`<option value="${q.id}" ${String(q.id)===String(fuTarget)?"selected":""}>${esc(q.company)} — ${esc(q.status)}</option>`).join("")}
          </select></div>
        <div><label class="l">Which moment</label>
          <select onchange="fuStage=this.value;fuOut='';render()">
            ${Object.entries(FOLLOWUPS).map(([k,v])=>`<option value="${k}" ${fuStage===k?"selected":""}>${esc(v[0])}</option>`).join("")}
          </select></div>
      </div>
      ${!S.queue.find(q=>String(q.id)===String(fuTarget))?"":`
        <div class="actions" style="margin-top:0">
          <button class="btn" onclick='copy(buildFollowupPrompt(S.queue.find(q=>String(q.id)==="${fuTarget}")),"Prompt copied")'>Copy prompt</button>
          <a class="mini" href="https://claude.ai/new" target="_blank" rel="noopener">Open claude.ai</a>
          ${flash?`<span class="flash">${esc(flash)}</span>`:""}
        </div>
        <div class="row" style="margin-top:16px"><div>
          <label class="l" for="fureply">Claude's reply</label>
          <textarea id="fureply" rows="3" placeholder="Paste the whole reply here"></textarea>
        </div></div>
        <div class="actions" style="margin-top:0">
          <button class="btn" onclick="showFollowup()">Show message</button>
          <button class="btn ghost" onclick="fuOut='';error='';render()">Clear</button>
        </div>
        ${error?`<div class="err">${esc(error)}</div>`:""}
        ${!fuOut?"":`
          <div style="margin-top:22px">
            ${fuOut.subject?`<p class="note" style="margin:0 0 8px"><strong>Subject:</strong> ${esc(fuOut.subject)}</p>`:""}
            <div class="letter">${esc(fuOut.message)}</div>
            <div class="actions">
              <button class="btn ghost" onclick='copy(${JSON.stringify((fuOut.subject?fuOut.subject+"\n\n":"")+(fuOut.message||""))},"Message copied")'>Copy message</button>
            </div>
            ${fuOut.variant?`<div class="sec" style="margin-top:20px"><div class="sech">Shorter version, for LinkedIn</div>
              <div class="bul">${esc(fuOut.variant)}</div>
              <div class="actions"><button class="btn ghost" onclick='copy(${JSON.stringify(fuOut.variant||"")},"Copied")'>Copy</button></div></div>`:""}
            ${fuOut.send_to?`<div class="item" style="margin-top:14px"><span class="tick" style="background:var(--accent)"></span><span><strong>Send to:</strong> ${esc(fuOut.send_to)}</span></div>`:""}
            ${fuOut.timing?`<div class="item"><span class="tick" style="background:var(--b2)"></span><span><strong>Timing:</strong> ${esc(fuOut.timing)}</span></div>`:""}
            ${fuOut.why?`<p class="foot">${esc(fuOut.why)}</p>`:""}
          </div>`}
      `}
    </div>`}`;
}
function toggleRow(e,id){ openRow = openRow===id?null:id; render(); }
function setStatus(id,v){ const r=S.queue.find(x=>x.id===id); if(r){ r.status=v; save(); updateFloor(); } }
function setField2(id,f,v){ const r=S.queue.find(x=>x.id===id); if(r){ r[f]=(v||"").trim(); save(); render(); } }
function setNext(id,v){ const r=S.queue.find(x=>x.id===id); if(r){ r.next=v; save(); } }
function removeRow(id){ S.queue = S.queue.filter(x=>x.id!==id); save(); render(); }

function viewProfile(){
  const p = profile();
  return `
    <h3 class="sub">Your background</h3>
    <p class="note" style="margin-top:0;margin-bottom:22px">Every assessment is scored against what's here.
    The more specific this is, the sharper the results. Switch operators to keep two job searches side by side.</p>
    <div class="row c2">
      <div><label class="l" for="who">Editing</label>
        <select id="who" onchange="S.activeProfile=this.value;save();render()">
          <option value="A" ${S.activeProfile==="A"?"selected":""}>${esc(S.profiles.A.name||"Operator A")}</option>
          <option value="B" ${S.activeProfile==="B"?"selected":""}>${esc(S.profiles.B.name||"Operator B")}</option>
        </select></div>
      <div><label class="l">Name</label><input value="${esc(p.name)}" oninput="setField('name',this.value)"></div>
    </div>
    <div class="row c2">
      <div><label class="l">Current title</label><input value="${esc(p.title)}" oninput="setField('title',this.value)"></div>
      <div><label class="l">Years of experience</label><input value="${esc(p.years)}" oninput="setField('years',this.value)"></div>
    </div>
    <div class="row"><div><label class="l">Skills and tools</label>
      <textarea rows="4" oninput="setField('skills',this.value)">${esc(p.skills)}</textarea></div></div>
    <div class="row"><div>
      <label class="l">Results with numbers in them</label>
      <textarea rows="4" placeholder="One per line. For example: cut critical-vulnerability backlog from 4,200 to under 400 in two quarters across 11,000 endpoints." oninput="setField('wins',this.value)">${esc(p.wins||"")}</textarea>
      <p class="foot" style="margin-top:8px">This is the highest-value field on the page. Assessments can only
      write strong resume bullets and cover notes if they have real numbers to work from. Add three or four,
      even rough ones.</p>
    </div></div>
    <div class="row"><div><label class="l">Boolean search string</label>
      <textarea rows="3" oninput="setField('booleans',this.value)">${esc(p.booleans)}</textarea></div></div>
    <div class="row"><div><label class="l">Work setup — what you will and won't accept</label>
      <textarea rows="2" oninput="setField('setup',this.value)">${esc(p.setup||"")}</textarea>
      <p class="foot" style="margin-top:8px">Say plainly where the line is. "Fully remote only" and "remote
      preferred, Metro Manila hybrid acceptable for a strong-fit role" produce different verdicts on the
      same posting.</p></div></div>
    <div class="row"><div><label class="l">Constraints — location, target employers</label>
      <textarea rows="3" oninput="setField('notes',this.value)">${esc(p.notes)}</textarea></div></div>

    <div class="sech" style="margin-top:32px">What ${esc(p.name || "this person")} needs to earn</div>
    <p class="note" style="margin-top:0;margin-bottom:14px">Set per person. A lead and an analyst have different
    market rates, so a single shared figure would wrongly reject good roles for one of you.</p>
    <div class="row c2">
      <div><label class="l">Take-home needed per month</label>
        <input type="number" value="${p.floorNet ?? 0}" oninput="setField('floorNet',Number(this.value)||0)"></div>
      <div><label class="l">Apply line — lowest fit score worth an hour</label>
        <input type="number" value="${p.applyThreshold ?? 65}" oninput="setField('applyThreshold',Number(this.value)||65)"></div>
    </div>

    <div class="sech" style="margin-top:28px">Shared assumptions</div>
    <div class="row c2">
      <div><label class="l">Gross-up multiplier</label>
        <input type="number" step="0.01" value="${S.taxUplift}" oninput="setNum('taxUplift',this.value)"></div>
      <div><label class="l">Pesos per US dollar</label>
        <input type="number" value="${S.fx}" oninput="setNum('fx',this.value)"></div>
    </div>
    <p class="foot">The gross-up multiplier turns take-home into the gross figure to negotiate for. 1.26 is a
    rough starting point for Philippine income tax plus SSS, PhilHealth and Pag-IBIG at this salary band. Run
    your own number through a current PH tax calculator and change it here. This tool doesn't give tax or
    financial advice.</p>`;
}
function setField(f,v){ S.profiles[S.activeProfile][f]=v; save(); updateFloor(); }
function setNum(f,v){ S[f]=Number(v)||0; save(); updateFloor(); }

function viewSettings(){
  return `
    <h3 class="sub">Settings</h3>
    <div class="row c2" style="margin-top:20px"><div>
      <label class="l" for="mode">How assessments are produced</label>
      <select id="mode" onchange="S.mode=this.value;save();render()">
        <option value="paste" ${S.mode==="paste"?"selected":""}>Paste into Claude chat — free</option>
        <option value="api" ${S.mode==="api"?"selected":""}>Automatic — needs an API key and credit</option>
      </select>
    </div></div>
    <p class="foot" style="margin-top:0">Free mode copies a prompt for you to paste into claude.ai and takes the
    reply back. Two extra copy-pastes, no cost. Automatic mode does it in one click but each assessment costs
    about a US cent. Everything else in this app is free either way.</p>

    ${S.mode==="api"?`
    <div class="row" style="margin-top:24px"><div>
      <label class="l" for="ak">Anthropic API key</label>
      <input id="ak" type="password" value="${esc(S.apiKey)}" placeholder="sk-ant-..." oninput="S.apiKey=this.value;save()">
    </div></div>
    <div class="row c2"><div>
      <label class="l">Model</label>
      <input value="${esc(S.model)}" oninput="S.model=this.value;save()">
    </div></div>
    <p class="foot">Create a key at console.anthropic.com and add a small amount of credit. The key is stored in
    this browser on this machine and only travels to Anthropic when you run a scan. Anyone with access to this
    computer can read it, so keep this file off shared machines.</p>`:""}

    <div class="sech" style="margin-top:34px">Your data</div>
    <p class="note">Profiles, income floor and queue all live in this browser's storage. Clearing your browsing
    data erases them, so export a copy before anything drastic — that's also how you move everything to another
    machine or share it.</p>
    <div class="actions">
      <button class="btn ghost" onclick='copy(JSON.stringify(S,null,2),"Copied to clipboard")'>Export to clipboard</button>
      <button class="btn ghost" onclick="importData()">Import from clipboard</button>
      <button class="btn ghost" onclick="wipe()">Reset everything</button>
      ${flash?`<span class="flash">${esc(flash)}</span>`:""}
    </div>`;
}
async function importData(){
  try{
    S = {...structuredClone(DEFAULTS), ...JSON.parse(await navigator.clipboard.readText())};
    save(); flash="Imported"; render();
  }catch{ error="There's nothing valid on the clipboard to import."; render(); }
}
function wipe(){
  if(!confirm("This deletes your profiles, queue and settings from this browser. Continue?")) return;
  localStorage.removeItem(KEY); S = structuredClone(DEFAULTS); render();
}

/* ---------- render ---------- */
const TABS = [["profile","Profile"],["resume","Resume"],["sources","Job Sources"],["queue","Queue"],["scan","Scan"],["interview","Interview"],["settings","Settings"]];

function updateFloor(){
  const today = new Date().toISOString().slice(0,10);
  const due = S.queue.filter(i=>i.next && i.next<=today && i.status!=="Rejected" && i.status!=="Withdrawn").length;
  document.getElementById("floor").innerHTML = [
    ["Take-home needed", peso(floorNet()), true],
    ["Gross to ask for", peso(grossFloor()), false],
    ["Or USD contract", "$"+usdFloor().toLocaleString()+"/mo", false],
    ["In queue", S.queue.length, false],
    ["Applications sent", S.queue.filter(i=>i.status!=="To apply").length, false],
    ["Follow-ups due", due, false]
  ].map(([l,v,k])=>`<div class="fig"><span class="figl">${l}</span>
    <span class="figv${k?" key":""}">${v}</span></div>`).join("");
  document.getElementById("opline").textContent = profile().name + "'s job search";
}

function render(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>
    `<button class="tab" role="tab" aria-selected="${tab===k}" onclick="go('${k}')">${l}</button>`).join("");
  updateFloor();
  const views = {profile:viewProfile, resume:viewResume, sources:viewSources, queue:viewQueue, scan:viewScan, interview:viewInterview, settings:viewSettings};
  document.getElementById("view").innerHTML = views[tab]();
}
function go(k){ tab=k; error=""; render(); }

render();
</script>
</body>
</html>
